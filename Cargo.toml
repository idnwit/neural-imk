[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
nimk-types = { path = "crates/nimk-types" }
nimk-storage = { path = "crates/nimk-storage" }
nimk-telex = { path = "crates/nimk-telex" }
nimk-policy = { path = "crates/nimk-policy" }
nimk-engine = { path = "crates/nimk-engine" }
nimk-tune = { path = "crates/nimk-tune" }
nimk-synth = { path = "crates/nimk-synth" }
nimk-hook = { path = "crates/nimk-hook" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"

# burn is ~40x slower unoptimized; keep dependencies fast in dev/test builds.
[profile.dev.package."*"]
opt-level = 3
