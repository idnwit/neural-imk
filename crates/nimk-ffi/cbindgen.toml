# cbindgen config for the Swift shim header (`make header` -> target/nimk_ffi.h).
language = "C"
include_guard = "NIMK_FFI_H"
autogen_warning = "/* Generated by cbindgen from crates/nimk-ffi. Do not edit. */"
sys_includes = ["stdbool.h", "stdint.h"]
no_includes = true
documentation = true
documentation_style = "c99"
cpp_compat = true
usize_is_size_t = true

[parse]
parse_deps = false

[export]
# Names are already prefixed in Rust (`Nimk*`, `NIMK_*`); add nothing.
prefix = ""
# `NimkCore` is not `#[repr(C)]`, so cbindgen emits it as an opaque
# `typedef struct NimkCore NimkCore;`.
include = ["NimkKey", "NimkCtx", "NimkOut", "NimkModelStats", "NimkTunePending", "NimkTuneReport"]

[enum]
prefix_with_name = false

[fn]
sort_by = "None"
