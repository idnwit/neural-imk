[package]
name = "nimk-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["staticlib", "rlib"]

# Own lint table: the only crate allowed `unsafe` (workspace denies it).
[lints.rust]
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
print_stdout = "deny"

[dependencies]
nimk-types.workspace = true
nimk-engine.workspace = true
nimk-storage.workspace = true

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
