# Builds the universal DMG for a release tag and attaches it to the GitHub
# release (scripts/package-dmg.sh, docs/07-build-and-install.md).
#
# Called by release-plz.yml after a release, or run by hand
# (Actions > Build DMG > Run workflow) to rebuild an existing tag.
#
# Signing is optional. Without these secrets the DMG is ad hoc signed and
# users need "Open Anyway" (System Settings > Privacy & Security):
#   MACOS_CERT_P12_BASE64   Developer ID Application certificate (.p12, base64)
#   MACOS_CERT_PASSWORD     password of that .p12
#   MACOS_SIGN_IDENTITY     e.g. "Developer ID Application: Name (TEAMID)"
# Notarization additionally needs:
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (app-specific password)
name: Build DMG

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, e.g. v0.2.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, e.g. v0.2.0
        required: true
        type: string

jobs:
  build:
    name: Build and upload
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
          # Full history: CFBundleVersion is `git rev-list --count HEAD`.
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cbindgen

      - name: Import signing certificate
        id: signing
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$CERT_P12_BASE64" || -z "$SIGN_IDENTITY" ]]; then
            echo "No signing secrets: the DMG will be ad hoc signed."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "NIMK_SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"
          if [[ -n "$APPLE_ID" && -n "$APPLE_TEAM_ID" && -n "$APPLE_APP_PASSWORD" ]]; then
            xcrun notarytool store-credentials nimk-notary \
              --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" --keychain "$keychain"
            echo "NIMK_NOTARY_PROFILE=nimk-notary" >> "$GITHUB_ENV"
          fi

      - name: Build DMG
        run: make dmg

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          dmg="$(ls build/NeuralIMK-*.dmg)"
          gh release upload "$TAG" "$dmg" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Remove signing keychain
        if: ${{ always() }}
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
